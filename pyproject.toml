[project]
name = "book2wordlist"
version = "0.1.0"
description = "Extract the most frequent lemmatized terms from an EPUB as a ranked CSV"
readme = "README.md"
authors = [
    { name = "Gabriel Pereira", email = "71646976+gabriel-rp@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "lxml>=6.1.3",
    "spacy>=3.8.16",
    "en-core-web-sm",
    "de-core-news-sm",
]

[project.scripts]
book2wordlist = "book2wordlist.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "coverage>=7.6.10",
    "pre-commit>=4.0.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.2",
]

[tool.coverage.run]
source = ["book2wordlist"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort: sorted imports
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PL",   # pylint
]

[tool.ruff.lint.isort]
# One import statement per module: several names from the same module are
# combined rather than repeated.
force-single-line = false
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Backends import their heavy third-party library inside the function that
# uses it, so importing the package (and running --help) stays instant.
"src/book2wordlist/readers/epub.py" = ["PLC0415"]
"src/book2wordlist/lemmatizers/spacy.py" = ["PLC0415"]
"tests/*" = ["PLC0415", "PLR0913", "PLR2004"]
